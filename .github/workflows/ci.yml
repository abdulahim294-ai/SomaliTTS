name: SomaliTTS CI

on:
  push:
    branches:
      - feature/platform-foundation
      - feature/omnivoice-instant-clone-ui
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: somalitts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify required files
        run: |
          test -f app.py
          test -f web/index.html
          test -f tests/test_web_ui.py
          test -f tests/test_omnivoice_audio.py
          test -f config.py
          test -f audio_pipeline.py
          test -f providers/edge.py
          test -f tests/test_app.py
          test -f tests/test_audio_pipeline.py

      - name: Compile Python files
        run: |
          python -m compileall -q \
            app.py \
            config.py \
            audio_pipeline.py \
            web_middleware.py \
            providers \
            tests

      - name: Run complete test suite
        run: |
          python -m pytest -v --tb=short


  web-app:
    name: Browser App Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check browser application JavaScript
        run: node --input-type=module --check < web/app.js
      - name: Verify required studio sections
        run: |
          grep -q 'id="panel-generate"' web/index.html
          grep -q 'id="panel-create"' web/index.html
          grep -q 'id="panel-voices"' web/index.html
          grep -q 'id="panel-library"' web/index.html
          grep -q 'MediaRecorder' web/app.js
          grep -q 'voice-avatars' supabase/migrations/20261128083357_voice_avatar_storage.sql
          grep -q 'node-edge-tts@1.2.12' supabase/functions/edge-tts/index.ts

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: |
          docker build \
            --pull \
            --tag somalitts:ci \
            .

      - name: Verify FFmpeg inside Docker image
        run: |
          docker run --rm \
            --entrypoint ffmpeg \
            somalitts:ci \
            -version

      - name: Verify FFprobe inside Docker image
        run: |
          docker run --rm \
            --entrypoint ffprobe \
            somalitts:ci \
            -version
