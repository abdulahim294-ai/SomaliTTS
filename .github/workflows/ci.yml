name: SomaliTTS CI

on:
  push:
    branches:
      - feature/platform-foundation
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: somalitts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify required files
        run: |
          test -f app.py
          test -f config.py
          test -f audio_pipeline.py
          test -f providers/edge.py
          test -f tests/test_app.py
          test -f tests/test_audio_pipeline.py

      - name: Compile Python files
        run: |
          python -m compileall -q \
            app.py \
            config.py \
            audio_pipeline.py \
            web_middleware.py \
            providers \
            tests

      - name: Validate Kaggle notebook JSON and Python syntax
        run: |
          python scripts/validate_notebook.py

      - name: Run complete test suite
        run: |
          python -m pytest -v --tb=short

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: |
          docker build \
            --pull \
            --tag somalitts:ci \
            .

      - name: Verify FFmpeg inside Docker image
        run: |
          docker run --rm \
            --entrypoint ffmpeg \
            somalitts:ci \
            -version

      - name: Verify FFprobe inside Docker image
        run: |
          docker run --rm \
            --entrypoint ffprobe \
            somalitts:ci \
            -version
