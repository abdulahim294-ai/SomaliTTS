name: SomaliTTS CI

on:
  push:
    branches:
      - feature/platform-foundation
      - feature/omnivoice-instant-clone-ui
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: somalitts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify required files
        run: |
          test -f app.py
          test -f web/index.html
          test -f tests/test_web_ui.py
          test -f tests/test_omnivoice_audio.py
          test -f config.py
          test -f audio_pipeline.py
          test -f providers/edge.py
          test -f tests/test_app.py
          test -f tests/test_audio_pipeline.py

      - name: Compile Python files
        run: |
          python -m compileall -q \
            app.py \
            config.py \
            audio_pipeline.py \
            web_middleware.py \
            providers \
            tests

      - name: Run complete test suite
        run: |
          python -m pytest -v --tb=short


  netlify-function:
    name: Netlify Edge TTS Function
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check Netlify function syntax and package API
        run: |
          node --check netlify/functions/edge-tts.mjs
          node --input-type=module -e 'import { EdgeTTS } from "node-edge-tts"; const tts = new EdgeTTS({ voice: "so-SO-MuuseNeural", lang: "so-SO" }); if (typeof tts.ttsPromise !== "function") process.exit(1);'

      - name: Check browser application JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("web/index.html").read_text()
          script = html.split('<script type="module">', 1)[1].split('</script>', 1)[0]
          Path('/tmp/somalitts-inline.mjs').write_text(script)
          PY
          node --check /tmp/somalitts-inline.mjs

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: |
          docker build \
            --pull \
            --tag somalitts:ci \
            .

      - name: Verify FFmpeg inside Docker image
        run: |
          docker run --rm \
            --entrypoint ffmpeg \
            somalitts:ci \
            -version

      - name: Verify FFprobe inside Docker image
        run: |
          docker run --rm \
            --entrypoint ffprobe \
            somalitts:ci \
            -version
